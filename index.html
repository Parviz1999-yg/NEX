<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b12">
  <title>NEX — Shaxsiy Reels Studio</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div id="app">
    <!-- HOME -->
    <section id="home" class="screen on">
      <header class="top">
        <div class="brand"><span class="mark">N</span> NEX</div>
        <span class="ver">v2.0 · Shaxsiy</span>
      </header>
      <div class="hero">
        <p class="eyebrow">SHAXSIY INSTAGRAM REELS STUDIO</p>
        <h1>4 xil post.<br><span>4 xil animatsiya.</span></h1>
        <p class="lead">Har bir turi o‘ziga xos harakat tiliga ega. Bir xil slaydshou yo‘q.</p>
      </div>
      <div class="modes">
        <button class="mode-card" data-mode="tavsiya">
          <span class="mode-icon">👤</span>
          <strong>Tavsiya akkaunt</strong>
          <small>Profil kartasi · orbit · obuna effekti</small>
        </button>
        <button class="mode-card" data-mode="fakt">
          <span class="mode-icon">⚡</span>
          <strong>Qiziqarli fakt</strong>
          <small>Muhr · pop · raqam urg‘usi</small>
        </button>
        <button class="mode-card" data-mode="ibora">
          <span class="mode-icon">❝</span>
          <strong>Kun iborasi</strong>
          <small>Sekin tipografika · blur · estetik</small>
        </button>
        <button class="mode-card" data-mode="manba">
          <span class="mode-icon">🔗</span>
          <strong>Foydali manba</strong>
          <small>Kartochkalar · ketma-ket ochilish</small>
        </button>
      </div>
    </section>

    <!-- EDITOR -->
    <section id="editor" class="screen">
      <header class="top">
        <button id="backHome" class="ghost">←</button>
        <div class="brand"><span class="mark">N</span> <span id="modeTitle">Tavsiya</span></div>
        <span class="ver" id="modeBadge">TAVSIYA</span>
      </header>

      <div class="editor-body">
        <div class="form-panel" id="formPanel"></div>

        <div class="preview-side">
          <div class="preview-wrap">
            <div id="stage" class="stage">
              <div id="frame" class="frame">
                <!-- dynamic content injected here -->
              </div>
            </div>
          </div>
          <div class="actions">
            <button id="playBtn" class="secondary">▶ Ko‘rish</button>
            <button id="recBtn" class="primary">⛶ EKRAN YOZUV REJIMI</button>
          </div>
          <p class="hint">Telefoningizdagi Screen Recorder bilan 9:16 formatda yozib oling.</p>
        </div>
      </div>
    </section>

    <!-- RECORDING OVERLAY -->
    <div id="recOverlay" class="rec-overlay" hidden>
      <div id="recFrame" class="rec-frame"></div>
      <div class="rec-bar">
        <span id="recStatus">RECORDING MODE · 9:16</span>
        <button id="recPlay">▶ Boshlash</button>
        <button id="recExit">✕ Chiqish</button>
      </div>
    </div>
  </div>

  <script src="assets/js/app.js"></script>
</body>
</html>
