<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b12">
  <title>NEX — Canvas Reels Studio</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div id="app">
    <section id="home" class="screen on">
      <header class="top">
        <div class="brand"><span class="mark">N</span> NEX</div>
        <span class="ver">v2.1 · Canvas</span>
      </header>
      <div class="hero">
        <p class="eyebrow">HTML5 CANVAS · SHAXSIY REELS</p>
        <h1>4 xil post.<br><span>Canvas grafikasi.</span></h1>
        <p class="lead">Har bir rejim o‘ziga xos canvas animatsiyasiga ega.</p>
      </div>
      <div class="modes">
        <button class="mode-card" data-mode="tavsiya">
          <span class="mode-icon">👤</span>
          <strong>Tavsiya akkaunt</strong>
          <small>Profil · orbit · zarralar</small>
        </button>
        <button class="mode-card" data-mode="fakt">
          <span class="mode-icon">⚡</span>
          <strong>Qiziqarli fakt</strong>
          <small>Muhr · pop · urg‘u</small>
        </button>
        <button class="mode-card" data-mode="ibora">
          <span class="mode-icon">❝</span>
          <strong>Kun iborasi</strong>
          <small>Tipografika · yumshoq fon</small>
        </button>
        <button class="mode-card" data-mode="manba">
          <span class="mode-icon">🔗</span>
          <strong>Foydali manba</strong>
          <small>Kartochkalar · ketma-ket</small>
        </button>
      </div>
    </section>

    <section id="editor" class="screen">
      <header class="top">
        <button id="backHome" class="ghost">←</button>
        <div class="brand"><span class="mark">N</span> <span id="modeTitle">Tavsiya</span></div>
        <span class="ver" id="modeBadge">TAVSIYA</span>
      </header>

      <div class="editor-body">
        <div class="form-panel" id="formPanel"></div>

        <div class="preview-side">
          <div class="preview-wrap">
            <canvas id="cv" width="360" height="640"></canvas>
          </div>
          <div class="actions">
            <button id="playBtn" class="secondary">▶ Ko‘rish</button>
            <button id="recBtn" class="primary">⛶ EKRAN YOZUV REJIMI</button>
          </div>
          <p class="hint">Canvas orqali chiziladi. Telefon Screen Recorder bilan 9:16 yozib oling.</p>
        </div>
      </div>
    </section>

    <div id="recOverlay" class="rec-overlay" hidden>
      <canvas id="recCv" width="1080" height="1920"></canvas>
      <div class="rec-bar">
        <span id="recStatus">RECORDING · 9:16 · CANVAS</span>
        <button id="recPlay">▶ Boshlash</button>
        <button id="recExit">✕ Chiqish</button>
      </div>
    </div>
  </div>
  <script src="assets/js/app.js"></script>
</body>
</html>
