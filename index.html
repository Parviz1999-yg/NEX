<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<title>NEX — Reels Studio</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="app">

  <section id="home" class="scr on">
    <div class="home-inner">
      <p class="eyebrow">NEX · REELS STUDIO</p>
      <h1>4 xil post.<br><span>4 xil animatsiya.</span></h1>
      <p class="lead">Har bir rejim o‘ziga xos harakat va dizayn tiliga ega.</p>
      <div class="mode-grid">
        <button class="mcard" data-mode="tavsiya">
          <span class="mi">👤</span>
          <b>Tavsiya akkaunt</b>
          <small>Profil · orbit · obuna</small>
        </button>
        <button class="mcard" data-mode="fakt">
          <span class="mi">⚡</span>
          <b>Qiziqarli fakt</b>
          <small>Muhr · pop · raqam</small>
        </button>
        <button class="mcard" data-mode="ibora">
          <span class="mi">❝</span>
          <b>Kun iborasi</b>
          <small>Tipografika · blur · estetik</small>
        </button>
        <button class="mcard" data-mode="manba">
          <span class="mi">🔗</span>
          <b>Foydali manba</b>
          <small>Glass · metall · orbit</small>
        </button>
      </div>
    </div>
  </section>

  <section id="editor" class="scr">
    <header class="bar">
      <button id="back" class="icon-btn">←</button>
      <div class="bar-title"><span id="modeName">Tavsiya</span></div>
      <span id="modeTag" class="tag">TAVSIYA</span>
    </header>

    <div class="layout">
      <div class="form-col" id="formCol"></div>
      <div class="preview-col">
        <div class="stage-wrap">
          <canvas id="cv" width="360" height="640"></canvas>
        </div>
        <div class="btns">
          <button id="play" class="btn secondary">▶ Ko‘rish</button>
          <button id="rec" class="btn primary">⛶ Ekran yozuv</button>
        </div>
        <p class="hint">Telefon Screen Recorder bilan 9:16 yozib oling.</p>
      </div>
    </div>
  </section>

  <div id="recLayer" class="rec-layer" hidden>
    <canvas id="rcv" width="1080" height="1920"></canvas>
    <div class="rec-ui">
      <span id="recLabel">RECORDING · 9:16</span>
      <button id="recPlay">▶</button>
      <button id="recClose">✕</button>
    </div>
  </div>

</div>
<script src="assets/js/app.js"></script>
</body>
</html>
